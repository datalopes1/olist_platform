services:                          
  postgres:                      
    image: postgres:17         
    container_name: olist_postgres   
    environment:                  
      POSTGRES_USER: ${POSTGRES_USER}   
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
      POSTGRES_DB: olist_db          
    ports:                         
      - "5433:5432"              
    volumes:                       
      - postgres_data:/var/lib/postgresql/data 
    healthcheck:                   
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d olist_db"] 
      interval: 5s                 
      timeout: 5s                   
      retries: 5                   

volumes:                           
  postgres_data: